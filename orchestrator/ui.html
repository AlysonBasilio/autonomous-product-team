<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0f0f0f;
    --surface: #1a1a1a;
    --border:  #2e2e2e;
    --muted:   #666;
    --text:    #d4d4d4;
    --bright:  #f0f0f0;
    --green:   #4ade80;
    --red:     #f87171;
    --yellow:  #fbbf24;
    --blue:    #60a5fa;
    --gap:     1.25rem;
  }

  body {
    font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: var(--gap);
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: var(--gap);
    border-bottom: 1px solid var(--border);
    margin-bottom: var(--gap);
  }
  .title { color: var(--bright); font-size: 14px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .badge-running   { background: #14532d; color: var(--green); }
  .badge-paused    { background: #451a03; color: var(--yellow); }
  .badge-done      { background: #1e3a5f; color: var(--blue); }
  .badge-escalated { background: #450a0a; color: var(--red); }
  .badge-awaiting  { background: #422006; color: #fcd34d; }

  button {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: background .1s;
  }
  button:hover { background: #2a2a2a; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  button.primary:hover { background: #1e40af; }
  button.danger { background: #7f1d1d; color: #fca5a5; border-color: #7f1d1d; }
  button.danger:hover { background: #991b1b; }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: var(--gap);
    margin-bottom: var(--gap);
  }

  h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .75rem;
  }

  .row { display: flex; gap: .5rem; margin-bottom: .35rem; align-items: center; }
  .label { color: var(--muted); min-width: 90px; flex-shrink: 0; }
  .value { color: var(--bright); word-break: break-all; }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  textarea, input[type="text"], input[type="password"], input:not([type]) {
    font-family: inherit;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    padding: .35rem .5rem;
  }
  textarea { resize: vertical; width: 100%; min-height: 64px; padding: .5rem; }
  textarea:focus, input:focus { outline: 1px solid var(--blue); }

  .btn-row { display: flex; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
  .summary-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: .75rem;
    margin-bottom: .75rem;
    color: var(--bright);
  }

  /* ── Issue cards ── */
  .issue-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: var(--gap);
    overflow: hidden;
  }
  .issue-card.card-escalated { border-color: #b91c1c; }
  .issue-card.card-awaiting  { border-color: #d97706; }

  .card-header {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .6rem var(--gap);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  a.card-title { color: inherit; text-decoration: none; }
a.card-title:hover { text-decoration: underline; }
.card-title {
    flex: 1;
    color: var(--bright);
    font-size: 12px;
    word-break: break-all;
    min-width: 0;
  }
  .card-delete {
    font-size: 11px;
    padding: 2px 7px;
    opacity: .5;
    flex-shrink: 0;
  }
  .card-delete:hover { opacity: 1; }

  .card-body { padding: .75rem var(--gap); }
  .card-row { display: flex; gap: .5rem; margin-bottom: .3rem; align-items: baseline; }
  .card-label { color: var(--muted); min-width: 80px; flex-shrink: 0; font-size: 11px; }
  .card-value { color: var(--text); word-break: break-all; }
  .card-value a { color: var(--blue); }

  .card-section { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); }
  .card-section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: .5rem;
  }

  .escalation-detail {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: .6rem;
    font-size: 11px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: .5rem;
  }

  /* ── History ── */
  .history-toggle {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .history-toggle:hover { color: var(--text); }

  .history-list { margin-top: .5rem; }
  .history-item {
    display: flex;
    gap: .75rem;
    padding: .25rem 0;
    border-bottom: 1px solid var(--border);
    align-items: baseline;
    font-size: 11px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-task { color: var(--bright); flex: 1; }
  a.history-task { color: var(--bright); }
  .history-meta { color: var(--muted); white-space: nowrap; }

  .follow-ups-toggle {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: .5rem;
    display: inline-block;
  }
  .follow-ups-toggle:hover { color: var(--text); }

  .empty { color: var(--muted); font-style: italic; }
  .hidden { display: none !important; }
  .error-msg { color: var(--red); font-size: 11px; margin-top: .25rem; }
</style>
</head>
<body>

<header>
  <span class="title">autonomous-product-team</span>
</header>

<!-- Global config (Synthup credentials) -->
<section id="setup-global" class="hidden">
  <h2>Global Config</h2>
  <div style="color:var(--muted);margin-bottom:.75rem">Configure your Synthup credentials.</div>
  <div class="row"><span class="label">tenant</span><input id="cfg-tenant" placeholder="your-tenant-id" style="flex:1"></div>
  <div class="row"><span class="label">api_key</span><input id="cfg-api_key" type="password" placeholder="Synthup API key" style="flex:1"></div>
  <div id="cfg-error" class="error-msg hidden"></div>
  <div class="btn-row"><button class="primary" onclick="saveConfig()">Save</button></div>
</section>

<!-- Submit form -->
<section id="submit-section" class="hidden">
  <h2>Run Issue</h2>
  <div class="row">
    <span class="label">issue</span>
    <textarea id="sub-issue" rows="3" placeholder="Describe the issue or paste a Linear URL" style="flex:1"></textarea>
  </div>
  <div class="row">
    <span class="label">repo</span>
    <input id="sub-repo" placeholder="https://github.com/owner/repo" style="flex:1">
  </div>
  <div id="sub-error" class="error-msg hidden"></div>
  <div class="btn-row"><button class="primary" onclick="submitIssue()">Run Issue</button></div>
</section>

<!-- Issue cards injected here -->
<div id="issues-container"></div>

<script>
  let state = {};

  // ── Polling ────────────────────────────────────────────────────────────────

  function poll() {
    fetch('/api/state').then(r => r.json()).then(applyState).catch(() => {});
    setTimeout(poll, 3000);
  }

  // ── Render ─────────────────────────────────────────────────────────────────

  function applyState(s) {
    state = s;
    const synthupOk = !!s.synthup_configured;

    document.getElementById('setup-global').classList.toggle('hidden', synthupOk);
    document.getElementById('submit-section').classList.toggle('hidden', !synthupOk);

    renderIssues(s.issues || []);
  }

  function issueStatus(issue) {
    if (issue.pending_approval)   return 'awaiting';
    if (issue.escalation)         return 'escalated';
    if (issue.current_task && !issue.paused) return 'running';
    if (issue.paused)             return 'paused';
    if (issue.lifecycle_stage === 'done') return 'done';
    return 'running';
  }

  function renderIssues(issues) {
    const container = document.getElementById('issues-container');
    if (!issues.length) { container.innerHTML = ''; return; }

    const activeEl = document.activeElement;

    const existingCards = {};
    container.querySelectorAll('.issue-card[data-id]').forEach(el => {
      existingCards[el.dataset.id] = el;
    });

    const renderedIds = new Set();

    issues.forEach(issue => {
      const id = String(issue.id);
      renderedIds.add(id);

      const tmp = document.createElement('div');
      tmp.innerHTML = renderCard(issue);
      const newCard = tmp.firstElementChild;

      const existing = existingCards[id];
      if (existing) {
        // Save input values, focus, and toggle visibility state before replacing
        const savedState = {};
        existing.querySelectorAll('[id]').forEach(el => {
          const isInput = el.tagName === 'TEXTAREA' || el.tagName === 'INPUT';
          savedState[el.id] = {
            value:   isInput ? el.value : undefined,
            hidden:  el.classList.contains('hidden'),
            focused: el === activeEl
          };
        });

        existing.replaceWith(newCard);

        // Restore saved state into the new card
        let focusId = null;
        Object.entries(savedState).forEach(([elId, data]) => {
          const el = document.getElementById(elId);
          if (!el) return;
          if (data.value !== undefined) el.value = data.value;
          if (data.hidden) el.classList.add('hidden');
          else             el.classList.remove('hidden');
          if (data.focused) focusId = elId;
        });
        if (focusId) {
          const el = document.getElementById(focusId);
          if (el) el.focus();
        }
      } else {
        container.appendChild(newCard);
      }
    });

    // Remove cards no longer in the list
    Object.entries(existingCards).forEach(([id, el]) => {
      if (!renderedIds.has(id)) el.remove();
    });
  }

  function renderCard(issue) {
    const status = issueStatus(issue);
    const title  = issue.title || truncate(issue.input_text || issue.id, 80);
    const repo   = issue.repo_url ? shortRepo(issue.repo_url) : '';
    const ct     = issue.current_task || {};

    let cardClass = 'issue-card';
    if (status === 'escalated') cardClass += ' card-escalated';
    if (status === 'awaiting')  cardClass += ' card-awaiting';

    const badge = `<span class="badge badge-${status}">${status}</span>`;

    // Current task row
    let taskHtml = '';
    if (ct.task && status !== 'awaiting') {
      const taskName = (ct.task || '').replace(/\.md$/, '');
      const elapsed  = ct.started_at ? `<span class="card-value issue-elapsed-live" data-started="${esc(ct.started_at)}">${formatElapsed(ct.started_at)}</span>` : '';
      const sessLink = ct.session_id ? sessionLink(ct.session_id) : '';
      taskHtml = `<div class="card-row">
        <span class="card-label">task</span>
        <span class="card-value">${esc(taskName)}</span>
        ${elapsed ? `<span style="color:var(--muted);margin-left:.25rem">·</span> ${elapsed}` : ''}
        ${sessLink ? `<span style="color:var(--muted);margin-left:.25rem">·</span> <span class="card-value">${sessLink}</span>` : ''}
      </div>`;
    }

    // PR URL (from current_task or last_pr_url)
    const prUrl = ct.pr_url || issue.last_pr_url;
    const prHtml = prUrl ? `<div class="card-row">
      <span class="card-label">pr</span>
      <span class="card-value"><a href="${esc(prUrl)}" target="_blank">${esc(prUrl)}</a></span>
    </div>` : '';

    // Escalation section
    let escalationHtml = '';
    if (issue.escalation) {
      const e = issue.escalation;
      const details = (e.details || '').replace(/^session_id:.*\n?/m, '').trimEnd();
      const sessHtml = e.session_id ? `\nsession: ${sessionLinkStr(e.session_id)}` : '';
      escalationHtml = `<div class="card-section">
        <div class="card-section-title" style="color:var(--red)">Escalated — ${esc(e.reason || 'error')}</div>
        <div class="escalation-detail">${esc(details)}${sessHtml}</div>
        <div class="btn-row">
          <button onclick='resolveEscalation(${JSON.stringify(issue.id)})'>Retry</button>
          <button onclick='dismissEscalation(${JSON.stringify(issue.id)})'>Dismiss</button>
        </div>
      </div>`;
    }

    // Approval section
    let approvalHtml = '';
    if (issue.pending_approval) {
      const p = issue.pending_approval;
      approvalHtml = `<div class="card-section">
        <div class="card-section-title" style="color:var(--yellow)">Demo Review</div>
        <div class="summary-box">${
          (p.issue_title ? `<strong>${esc(p.issue_title)}</strong><br>` : '') +
          (p.summary    ? `${esc(p.summary)}<br>` : '') +
          (p.pr_url     ? `<a href="${esc(p.pr_url)}" target="_blank">${esc(p.pr_url)}</a>` : '')
        }</div>
        <div class="btn-row">
          <button class="primary" onclick='approve(${JSON.stringify(issue.id)})'>Approve</button>
        </div>
        <div style="margin-top:.75rem">
          <textarea id="dr-feedback-${esc(issue.id)}" placeholder="Describe what needs to change…" rows="3"></textarea>
          <span class="follow-ups-toggle" onclick='toggleFollowUps(${JSON.stringify(issue.id)})'>[+] Add follow-up issues</span>
          <textarea id="dr-followups-${esc(issue.id)}" class="hidden" placeholder="One follow-up issue per line: title — description" rows="3"></textarea>
          <div class="btn-row">
            <button class="danger" onclick='redirect(${JSON.stringify(issue.id)})'>Send Redirect</button>
          </div>
        </div>
      </div>`;
    }

    // History section
    const history = issue.history || [];
    let historyHtml = '';
    if (history.length) {
      const items = [...history].reverse().slice(0, 20).map(h => {
        const icon    = outcomeIcon(h.report?.type || h.report?.outcome);
        const taskStr = (h.task || h.report?.type || '?').replace(/\.md$/, '');
        const dur     = h.duration_s ? `${h.duration_s}s` : '';
        const url     = sessionUrl(h.session_id);
        const taskHtml = url
          ? `<a class="history-task" href="${esc(url)}" target="_blank">${esc(taskStr)}</a>`
          : `<span class="history-task">${esc(taskStr)}</span>`;
        return `<div class="history-item"><span>${icon}</span>${taskHtml}<span class="history-meta">${esc(dur)}</span></div>`;
      }).join('');
      const histId = `hist-${esc(issue.id)}`;
      historyHtml = `<div class="card-section">
        <span class="history-toggle" onclick='toggleHistory(${JSON.stringify(issue.id)})'
              id="hist-toggle-${esc(issue.id)}">▶ history (${history.length})</span>
        <div id="${histId}" class="history-list hidden">${items}</div>
      </div>`;
    }

    // Per-card pause/resume/cancel controls (only when running or paused)
    let controlsHtml = '';
    if (status === 'running' || status === 'paused') {
      controlsHtml = `<div class="card-section">
        <div class="btn-row">
          <button onclick='togglePause(${JSON.stringify(issue.id)}, ${JSON.stringify(status)})'>${status === 'paused' ? 'Resume' : 'Pause'}</button>
          <button class="danger" onclick='cancelIssue(${JSON.stringify(issue.id)})'>Cancel</button>
        </div>
      </div>`;
    }

    return `<div class="issue-card ${cardClass}" data-id="${esc(issue.id)}">
      <div class="card-header">
        ${ct.session_id ? `<a class="card-title" href="${esc(sessionUrl(ct.session_id))}" target="_blank">${esc(title)}</a>` : `<span class="card-title">${esc(title)}</span>`}
        ${badge}
        <button class="card-delete" onclick='deleteIssue(${JSON.stringify(issue.id)})' title="Delete issue">×</button>
      </div>
      <div class="card-body">
        ${repo ? `<div class="card-row"><span class="card-label">repo</span><span class="card-value">${esc(repo)}</span></div>` : ''}
        ${taskHtml}
        ${prHtml}
        ${escalationHtml}
        ${approvalHtml}
        ${controlsHtml}
        ${historyHtml}
      </div>
    </div>`;
  }

  // ── Actions ────────────────────────────────────────────────────────────────

  function saveConfig() {
    const cfg = {
      tenant:  document.getElementById('cfg-tenant').value.trim(),
      api_key: document.getElementById('cfg-api_key').value.trim()
    };
    const err = document.getElementById('cfg-error');
    if (!cfg.tenant || !cfg.api_key) {
      showError(err, 'tenant and api_key are required.');
      return;
    }
    hideError(err);
    fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) })
      .then(r => r.json()).then(j => {
        if (j.error) showError(err, j.error);
        else document.getElementById('cfg-api_key').value = '';
      }).catch(() => {});
  }

  function submitIssue() {
    const input_text = document.getElementById('sub-issue').value.trim();
    const repo_url   = document.getElementById('sub-repo').value.trim();
    const err        = document.getElementById('sub-error');
    if (!input_text) { showError(err, 'issue is required.'); return; }
    if (!repo_url)   { showError(err, 'repo is required.'); return; }
    hideError(err);
    fetch('/api/issues', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ issue: input_text, repo_url })
    }).then(r => r.json().then(j => ({ ok: r.ok, j }))).then(({ ok, j }) => {
      if (!ok || j.error) { showError(err, j.error || 'Failed to submit issue'); return; }
      document.getElementById('sub-issue').value = '';
      // don't clear repo — user likely submitting multiple issues to same repo
    }).catch(() => {});
  }

  function deleteIssue(issueId) {
    if (!confirm('Delete this issue?')) return;
    fetch(`/api/issues/${encodeURIComponent(issueId)}`, { method: 'DELETE' })
      .then(r => r.json().then(j => ({ ok: r.ok, j }))).then(({ ok, j }) => {
        if (!ok) alert(j.error || 'Cannot delete issue');
      }).catch(() => {});
  }

  function approve(issueId) {
    const followUpsRaw = document.getElementById(`dr-followups-${issueId}`)?.value.trim() || '';
    const follow_up_issues = followUpsRaw
      ? followUpsRaw.split('\n').filter(Boolean).map(line => {
          const [title, ...rest] = line.split('—');
          return { title: title.trim(), description: rest.join('—').trim() };
        })
      : undefined;
    api('POST', '/api/approve', { issue_id: issueId, follow_up_issues });
  }

  function redirect(issueId) {
    const user_feedback = document.getElementById(`dr-feedback-${issueId}`)?.value.trim();
    if (!user_feedback) {
      document.getElementById(`dr-feedback-${issueId}`)?.focus();
      return;
    }
    api('POST', '/api/redirect', { issue_id: issueId, user_feedback });
  }

  function resolveEscalation(issueId) {
    api('POST', '/api/resolve-escalation', { issue_id: issueId });
  }

  function dismissEscalation(issueId) {
    api('POST', '/api/dismiss-escalation', { issue_id: issueId });
  }

  function togglePause(issueId, status) {
    api('POST', status === 'paused' ? '/api/resume' : '/api/pause', { issue_id: issueId });
  }

  function cancelIssue(issueId) {
    api('POST', '/api/cancel', { issue_id: issueId });
  }

  function toggleHistory(issueId) {
    const el = document.getElementById(`hist-${issueId}`);
    const toggle = document.getElementById(`hist-toggle-${issueId}`);
    if (!el) return;
    const collapsed = el.classList.toggle('hidden');
    const count = el.querySelectorAll('.history-item').length;
    toggle.textContent = (collapsed ? '▶' : '▼') + ` history (${count})`;
  }

  function toggleFollowUps(issueId) {
    document.getElementById(`dr-followups-${issueId}`)?.classList.toggle('hidden');
  }

  // ── Utils ──────────────────────────────────────────────────────────────────

  function api(method, path, body) {
    fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).catch(() => {});
  }

  function sessionUrl(sessionId) {
    const tenant = state.synthup?.tenant;
    if (!tenant || !sessionId) return null;
    return `https://www.synthup.dev/t/${encodeURIComponent(tenant)}/s/${encodeURIComponent(sessionId)}`;
  }

  function sessionLink(sessionId) {
    const url = sessionUrl(sessionId);
    if (!url) return `<span style="color:var(--muted)">${esc(sessionId)}</span>`;
    return `<a href="${esc(url)}" target="_blank">${esc(sessionId.slice(0, 8))}</a>`;
  }

  function sessionLinkStr(sessionId) {
    const url = sessionUrl(sessionId);
    if (!url) return esc(sessionId);
    return `<a href="${esc(url)}" target="_blank">${esc(sessionId)}</a>`;
  }

  function shortRepo(url) {
    const m = url.match(/github\.com\/([^/]+\/[^/]+)/);
    return m ? m[1] : url;
  }

  function truncate(s, n) {
    if (!s) return '';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatElapsed(iso) {
    const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 60)   return `${secs}s`;
    if (secs < 3600) return `${Math.floor(secs/60)}m ${secs%60}s`;
    return `${Math.floor(secs/3600)}h ${Math.floor((secs%3600)/60)}m`;
  }

  function outcomeIcon(type) {
    if (!type) return '·';
    if (type.includes('fail') || type === 'escalate' || type === 'blocked') return '✗';
    if (type.includes('complete') || type.includes('pass') || type.includes('approved') || type === 'done') return '✓';
    return '·';
  }

  function showError(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }
  function hideError(el)      { el.textContent = ''; el.classList.add('hidden'); }

  poll();

  // Tick elapsed timers every second
  setInterval(() => {
    document.querySelectorAll('.issue-elapsed-live[data-started]').forEach(el => {
      el.textContent = formatElapsed(el.dataset.started);
    });
  }, 1000);
</script>
</body>
</html>
